name: Deploy React App to S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    env:
        AWS_REGION: eu-west-1
        STACK_NAME: ${{ env.STACK_NAME }}
        BUCKET_NAME: ${{ env.BUCKET_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy CloudFormation stack
        run: |
          STACK_NAME="${{ env.STACK_NAME }}"
          BUCKET_NAME="${{ env.BUCKET_NAME }}"
          
          echo "Deploying CloudFormation stack: $STACK_NAME with bucket: $BUCKET_NAME"
          
          aws cloudformation deploy \
            --template-file aws/cloudformation.yaml \
            --stack-name "$STACK_NAME" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides BucketName="$BUCKET_NAME"

      - name: Sync React build to S3
        run: |
          BUCKET_NAME="${{ github.event.inputs['bucket-name'] }}"
          
          echo "Deploying build to bucket: $BUCKET_NAME"
          
          aws s3 sync ./rl-frontend/build s3://$BUCKET_NAME --delete
